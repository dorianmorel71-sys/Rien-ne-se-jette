@let l = legume();

<div class="entete">
  <h2>{{ l.nom }}</h2>
  <div class="actions">
    <span class="score">{{ l.score }}</span>
    <app-bouton-favori
      [actif]="favoris.estLegumeFavori(l.id)"
      (basculer)="favoris.basculerLegume(l.id)"
    />
  </div>
</div>

<p class="intro">{{ l.intro }}</p>

<div class="parties">
  @for (partie of l.parties; track partie.nom) {
    <div class="partie">
      <h3>{{ partie.nom }}</h3>
      <ul>
        @for (usage of partie.usages; track usage) {
          <li [innerHTML]="usage"></li>
        }
      </ul>
    </div>
  }
</div>

@if (l.avertissement) {
  <app-alerte>{{ l.avertissement }}</app-alerte>
}

@if (l.restes?.length) {
  <button class="voir-recettes" type="button" (click)="voirRecettes()">
    Voir les recettes avec ces restes →
  </button>
}
